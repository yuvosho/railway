name: Weekly Website Audit

on:
  schedule:
    # Cada lunes a las 8:00 AM (UTC-3 Argentina = 11:00 UTC)
    - cron: '0 11 * * 1'
  workflow_dispatch: # Permite ejecucion manual

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run weekly audit
        run: npm run audit
        env:
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Generate HTML report
        run: npm run report

      - name: Commit and push results
        run: |
          git config user.name "Valsho Audit Bot"
          git config user.email "audit-bot@valsho.com.ar"
          DATE=$(date +%Y-%m-%d)
          git add monitoring/reports/
          git diff --staged --quiet || git commit -m "Auditoria semanal ${DATE}"
          git push
